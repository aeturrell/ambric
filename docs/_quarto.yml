project:
  type: website

website:
  title: "AMBRIC"
  favicon: favicon.ico
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: use.ipynb
        text: Use
      - text: "Reference"
        file: reference/index.qmd

format:
  html:
    theme: flatly
    css: styles.css
    toc: true

# tell quarto to read the generated sidebar
metadata-files:
  - _sidebar.yml


quartodoc:
  # the name used to import the package you want to create reference docs for
  package: AMBRIC
  parser: google

  # write sidebar data to this file
  sidebar: _sidebar.yml

  sections:
    - title: "Core"
      desc: "Main model class and out-of-sample evaluation"
      contents:
        - Ambric
        - run_out_of_sample_exercise
    - title: "In-sample diagnostics"
      desc: "Plotting and RMSE functions for fitted model results"
      contents:
        - diagnostics.plot_national_quarterly_vs_implied
        - diagnostics.plot_regional_annual_estimate
        - diagnostics.plot_single_region_annual_estimate
        - diagnostics.plot_estimated_regional_quarterly
        - diagnostics.plot_current_nowcast
        - diagnostics.rmse_regions_quarterly
        - diagnostics.rmse_regions_annual
        - diagnostics.rmse_national_quarterly
        - diagnostics.recession_indicator
    - title: "Loadings diagnostics"
      desc: "Functions for inspecting estimated model loadings"
      contents:
        - diagnostics.assemble_loadings_data
        - diagnostics.plot_loadings_by_region
        - diagnostics.plot_loadings_aggregate
    - title: "Out-of-sample diagnostics"
      desc: "Plotting and evaluation for out-of-sample exercises"
      contents:
        - diagnostics.plot_out_of_sample_nowcasts
        - diagnostics.plot_out_of_sample_rmse
        - diagnostics.out_of_sample_classification_performance_table
    - title: "Utilities"
      desc: "Data preparation and simulation"
      contents:
        - utilities.generate_realistic_simulated_data
        - utilities.prep_data_for_model_run
