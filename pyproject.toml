[project]
name = "ambric"
version = "0.0.2"
description = "Augmented Mixed-frequency Bayesian Regional Inference with Constraints"
authors = [{name="Arthur Turrell", email="anon@anon.gmail.com"}]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "arviz>=0.23.1",
    "graphviz>=0.21",
    "great-docs[svg]>=0.10.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pyarrow>=23.0.0",
    "pydemetra",
    "pymc>=5.25.1",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.6.9",
    "jupyter>=1.1.1",
    "nbstripout>=0.8.1",
    "nox>=2024.10.9",
    "pre-commit>=4.0.1",
    "pre-commit-hooks>=5.0.0",
    "pygments>=2.18.0",
    "pytest>=8.3.4",
    "quartodoc>=0.9.1",
    "ruff>=0.8.3",
    "toml>=0.10.2",
    "typing-extensions>=4.12.2",
    "xdoctest[colors]>=1.2.0",
    "ipykernel>=6.29.5",
    "pydoclint>=0.6.0",
    "ty>=0.0.14",
    "typeguard>=4.4.4",
]

[tool.uv]
package = true

[tool.uv.sources]
pydemetra = { git = "https://github.com/aeturrell/pydemetra" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/ambric/plot_style.txt" = "ambric/plot_style.txt"

[tool.pydoclint]
style = 'google'
exclude = ["noxfile.py", "tests/", "docs/"]
